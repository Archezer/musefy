[project]
name = "music-recommendation-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.30,<4",
    "mutagen>=1.48.1",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "pandas>=3.0.5",
    "pyside6>=6.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "telethon>=1.44.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.16.0",
    "torchvision>=0.28.0",
    "transformers>=4.40,<5",
    "yt-dlp[default]>=2026.8.19",
]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
