[project]
name = "music-recommendation-system"
version = "1.0.0"
description = "A local Windows music library with mood-aware recommendations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.30,<4",
    "librosa>=1.0.0",
    "mutagen>=1.48.1",
    "numpy>=2.5.2",
    "torchcodec>=0.16.0",
    "pandas>=3.0.5",
    "pyside6>=6.11.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.4",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "telethon>=1.44.0",
    "transformers>=4.40,<5",
    "yt-dlp[default]>=2026.8.19",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime==1.26.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
]
cuda = [
    "onnxruntime-gpu==1.26.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
