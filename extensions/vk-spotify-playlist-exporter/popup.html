<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VK + Spotify Playlist Exporter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>VK + Spotify Playlist Exporter</h1>
      <p class="hint">
        Open a VK Music or Spotify playlist. On VK, click “Show all” first if
        VK displays that button.
      </p>
      <button id="export-button" type="button">Export current playlist</button>
      <p id="status" class="status" role="status">Ready.</p>
      <p class="privacy">
        No cookies, passwords, audio URLs, or audio files are read or exported.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
